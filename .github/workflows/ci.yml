name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (rebuilds node-pty against Electron)
        run: npm ci
      - name: Syntax-check sources
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
